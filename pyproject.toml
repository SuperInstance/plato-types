[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "plato-types"
version = "1.0.0"
description = "Core types for the PLATO tile protocol — lifecycle, clocks, provenance"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.pytest.ini_options]
pythonpath = ["."]
